      display: inline-table;
      border-collapse: collapse;

      background: {{TH_BG}};
      color: {{TH_COLOR}};
      border: 1px solid {{BORDER_COLOR}};

      text-align: center;
      font-weight: bold;
    }
    td {
      background: {{TD_BG}};
      border: 1px solid {{BORDER_COLOR}};
      font-size: 9pt;
      padding: 4px 6px;
      vertical-align: top;
    }
    .special-finish {
      border: 2px double black;
      text-align: center;
      padding: 10px;
      font-family: "HY견명조", "맑은고딕", sans-serif;
